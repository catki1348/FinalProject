<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스테이지4 · 눈먼 동굴 괴수 공격</title>
<style>body{margin:0;background:#17131c;color:#f0e7ee;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:27px;margin:0 0 10px}p{color:#c0adc4;line-height:1.6}.layout{display:grid;grid-template-columns:150px 1fr;gap:16px;margin-top:18px}aside img{width:100%;border-radius:10px}aside p{font-size:12px}canvas{width:100%;background:#211b29;border-radius:12px}nav,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button,select{background:#37283e;color:#f2e4fa;border:1px solid #765180;border-radius:7px;padding:9px;cursor:pointer}button[aria-pressed=true]{background:#774b83}input{accent-color:#c595e0}#seek{flex:1;min-width:140px}.note{font-size:13px}#status{color:#d7b6ea}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{display:flex;gap:12px}aside img{width:80px}}</style>
<main><h1>눈먼 동굴 괴수 · 공격 4종 · 이동 2종</h1><p>원본 테마와 공통 측면 원화를 참조해 생성한 준비·타격 키포즈입니다.</p><nav id="patterns"></nav><div class="layout"><aside><img src="reference_theme.png" alt="원본 테마 이미지"><p>회백색 피부 · 붉은 발톱<br>여러 긴 팔 · 어두운 등 돌기<br>보라색 복부 · 큰 입</p></aside><canvas id="stage" width="1000" height="600" aria-label="선택한 공격 애니메이션"></canvas></div><div class="controls"><button id="play">정지</button><button id="mirror">오른쪽</button><button id="windup">준비 자세</button><button id="strike">타격 자세</button><label><input id="sequence" type="checkbox" checked>4종 순서 재생</label><label><input id="effects" type="checkbox" checked>판정 연출</label><select id="speed" aria-label="속도"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select><input id="seek" type="range" min="0" max="1000" value="0" aria-label="동작 시점"><output id="status"></output></div><p id="detail"></p><p class="note">공격당 새 원화 2장, 전체 8장입니다. 포즈 전환은 보스2와 같은 방식이며 중간 관절 보간은 없습니다. 판정 연출은 시각 참고용입니다. 실제 충돌·피해·Unity 전투 적용은 포함하지 않습니다.</p></main>
<script>
const patterns=[{id:'ClawSlash',label:'발톱 베기',hit:.35,d:.7,info:'일반 1 · 피해 16 · 0.35초 타격 · 뒤로 빠져 회피'},{id:'LowSweep',label:'하단 휩쓸기',hit:.4,d:.8,info:'일반 2 · 피해 14 · 0.40초 타격 · 점프로 회피'},{id:'SonicRoar',label:'음파 포효',hit:.5,d:1.9,info:'특수 1 · 0.50초 시작 · 1초 간격 최대 2틱 · 뒤 또는 사거리 밖으로 회피'},{id:'CaveCollapse',label:'천장 낙석',hit:.8,d:1.4,info:'특수 2 · 0.80초 발동 · 경고 영역 밖으로 이동'},{id:'Jump',label:'점프',hit:.3,d:.8,info:'이동 2 · 피해 없음 · 0.30초 도약 · 착지 지점에서 벗어나기'},{id:'Charge',label:'돌진',hit:.6,d:1.5,info:'이동 3 · 피해 18 · 0.60초 준비 후 돌진 · 점프 또는 옆으로 이동'}];
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),images={};let index=0,t=0,last=0,running=true,sign=1,ready=false;
const loads=patterns.flatMap(p=>[1,2].map(i=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{images[p.id+'_'+i]=im;resolve()};im.onerror=()=>reject(new Error(p.id));im.src=p.id+'_'+String(i).padStart(2,'0')+'.png'})));
patterns.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.label;b.onclick=()=>{index=i;t=0;document.getElementById('sequence').checked=false;update();draw()};document.getElementById('patterns').append(b)});
// A single timeline drives pose switching and the illustrative attack effects.
function update(){document.querySelectorAll('#patterns button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));document.getElementById('detail').textContent=patterns[index].info}
function pauseAt(value){t=value;running=false;document.getElementById('play').textContent='재생';draw()}
document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'정지':'재생'};
document.getElementById('mirror').onclick=()=>{sign*=-1;document.getElementById('mirror').textContent=sign===1?'오른쪽':'왼쪽';draw()};
document.getElementById('windup').onclick=()=>pauseAt(0);document.getElementById('strike').onclick=()=>pauseAt(patterns[index].hit);
document.getElementById('seek').oninput=e=>pauseAt(+e.target.value/1000*patterns[index].d);
function ellipse(x,y,w,h,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);ctx.fill()}
function draw(){if(!ready)return;const p=patterns[index];ctx.clearRect(0,0,1000,600);ctx.fillStyle='#241d2c';ctx.fillRect(0,0,1000,600);ctx.fillStyle='#3c3045';ctx.fillRect(0,570,1000,30);ctx.strokeStyle='#9268a2';ctx.beginPath();ctx.moveTo(0,570);ctx.lineTo(1000,570);ctx.stroke();ctx.save();if(sign<0){ctx.translate(1000,0);ctx.scale(-1,1)}ctx.imageSmoothingEnabled=false;const pose=t<p.hit?1:2;const im=images[p.id+'_'+pose],dw=im.width*.45;const k=t-p.hit,off=p.id==='Charge'&&k>=0?Math.min(k/.9,1)*200:p.id==='Jump'&&k>=0?Math.min(k/.5,1)*220:0,lift=p.id==='Jump'&&k>=0&&k<=.5?Math.sin(k/.5*Math.PI)*120:0;ctx.drawImage(im,45+644.4/2-dw/2+off,34.5-lift,dw,539.1);ctx.fillStyle='#84c8e5';ctx.fillRect(790,498,16,70);ellipse(798,488,11,11,'#84c8e5');const age=t-p.hit;
// These overlays are preview-only and do not replace generated game VFX assets.
if(document.getElementById('effects').checked){if(p.id==='ClawSlash'&&age>=0&&age<.16){ctx.strokeStyle='#ed7880';ctx.lineWidth=7;ctx.beginPath();ctx.arc(565,370,80,-1.15,1.15);ctx.stroke()}if(p.id==='LowSweep'&&age>=0&&age<.16){ctx.strokeStyle='#ed7880';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(480,532);ctx.lineTo(685,532);ctx.stroke()}if(p.id==='Charge'&&age<0){ctx.strokeStyle='#ed788099';ctx.lineWidth=5;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(430,566);ctx.lineTo(760,566);ctx.stroke();ctx.setLineDash([])}if(p.id==='SonicRoar'&&age>=0&&age<1.2){for(let i=0;i<3;i++){let a=(age+i*.22)%.7;ctx.strokeStyle=`rgba(202,157,224,${1-a/.7})`;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(570+a*230,350,15+a*55,25+a*70,0,-1.2,1.2);ctx.stroke()}}if(p.id==='CaveCollapse'){if(age<0)ellipse(798,569,55,7,'#df6d9088');if(t>=.6&&age<.2){let y=250+Math.min(1,(t-.6)/.2)*265;ctx.fillStyle='#968397';ctx.beginPath();ctx.moveTo(770,y);ctx.lineTo(820,y-10);ctx.lineTo(842,y+20);ctx.lineTo(809,y+55);ctx.lineTo(759,y+35);ctx.closePath();ctx.fill()}}}ctx.restore();document.getElementById('seek').value=Math.min(1000,t/p.d*1000);document.getElementById('status').textContent=`${Math.min(t,p.d).toFixed(2)} / ${p.d.toFixed(2)}초 · ${t<p.hit?'준비':'발동·회복'}`}
// A half-second gap makes each two-pose attack readable before it repeats.
function tick(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(running&&ready){t+=dt*+document.getElementById('speed').value;if(t>patterns[index].d+.5){t=0;if(document.getElementById('sequence').checked){index=(index+1)%patterns.length;update()}}}draw();requestAnimationFrame(tick)}
Promise.all(loads).then(()=>{ready=true;update();requestAnimationFrame(tick)}).catch(e=>document.getElementById('detail').textContent='이미지 로드 실패: '+e.message);
</script></html>
