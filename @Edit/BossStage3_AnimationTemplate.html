<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>화산 전갈 · 공격 애니메이션 7종</title>
<style>
body{margin:0;background:#151313;color:#eee7dc;font:16px system-ui}main{max-width:1050px;margin:24px auto;padding:20px}h1{font-size:26px}p{color:#c9bcae;line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap}button,select{background:#302924;color:inherit;border:1px solid #78624b;border-radius:7px;padding:10px;cursor:pointer}button[aria-pressed=true]{background:#813711}canvas{display:block;width:100%;background:#211c1b;border-radius:12px;margin:18px 0}section{display:flex;align-items:center;gap:12px;flex-wrap:wrap}input{flex:1;min-width:160px;accent-color:#ff9a42}#phase{color:#ffc482}small{color:#b6a79a}
</style><main>
<h1>화산 전갈 · 일반 공격 5 / 필살기 2</h1>
<p>GPT_Work_Room에서 생성한 이펙트를 연결했습니다. 7종 공격을 순서대로 재생합니다.</p>
<nav id="patterns" aria-label="공격 패턴"></nav>
<canvas id="stage" width="1000" height="480" aria-label="선택한 보스 공격 애니메이션"></canvas>
<section><button id="play">정지</button><button id="mirror">방향: 오른쪽</button><label><input id="sequence" type="checkbox" checked style="min-width:0">7종 순서 재생</label><label><input id="effects" type="checkbox" checked style="min-width:0">이펙트 표시</label><label>속도 <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><input id="seek" type="range" min="0" max="1000" value="0" aria-label="동작 시점"><output id="phase"></output></section>
<p id="detail"></p><small>붉은 표식: 예고 · 청색 표식: 플레이어 크기 참고. 기존 동작 프레임과 생성 이펙트의 조합 시안이며, 충돌·피해 계산은 포함하지 않습니다.</small>
</main><script>
const patterns=__PATTERNS__, sources=__IMAGES__, effectSources=__EFFECTS__;
const images={};let failed=0;
const loads=Object.entries(sources).map(([key,src])=>new Promise(resolve=>{const im=new Image();im.onload=resolve;im.onerror=()=>{failed++;resolve()};im.src=src;images[key]=im}));
const effectImages={};
Object.entries(effectSources).forEach(([key,src])=>loads.push(new Promise(resolve=>{const im=new Image();im.onload=resolve;im.onerror=()=>{failed++;resolve()};im.src=src;effectImages[key]=im})));
const c=document.getElementById('stage'),ctx=c.getContext('2d'),seek=document.getElementById('seek'),phase=document.getElementById('phase');
let index=0,t=0,running=true,sign=1,last=0,ready=false;
// A single selected timeline controls both body poses and attack effects.
patterns.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.kind+' · '+p.label;b.onclick=()=>{index=i;t=0;document.getElementById('sequence').checked=false;update()};document.getElementById('patterns').append(b)});
function update(){const p=patterns[index];document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));document.getElementById('detail').textContent=`${p.label} · 피해 ${p.damage} · 회피: ${p.dodge} · 전체 ${p.duration.toFixed(2)}초`}
document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'정지':'재생'};
document.getElementById('mirror').onclick=()=>{sign*=-1;document.getElementById('mirror').textContent=sign===1?'방향: 오른쪽':'방향: 왼쪽'};
seek.oninput=()=>{t=Number(seek.value)/1000*patterns[index].duration;running=false;document.getElementById('play').textContent='재생';draw()};
// Generated PNGs keep their native alpha; position, scale and opacity animate only in the preview.
function effect(id,x,y,w,h,opacity=1,angle=0,crop=null){const im=effectImages[id];if(!document.getElementById('effects').checked||!im?.naturalWidth)return;ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,opacity));ctx.translate(x,y);ctx.rotate(angle);if(crop)ctx.drawImage(im,...crop,-w/2,-h/2,w,h);else ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function pulse(age,duration){return age<0||age>duration?0:Math.sin(Math.PI*age/duration)}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function draw(){const p=patterns[index];ctx.clearRect(0,0,1000,480);ctx.fillStyle='#382923';ctx.fillRect(0,398,1000,82);ctx.strokeStyle='#a76337';ctx.beginPath();ctx.moveTo(0,398);ctx.lineTo(1000,398);ctx.stroke();
ctx.save();if(sign<0){ctx.translate(1000,0);ctx.scale(-1,1)}
let shift=p.id==='BasaltRush'?Math.max(0,Math.min(1,(t-.75)/.45))*180:0;
const frame=p.frames.filter(f=>f.time<=t).at(-1)||p.frames[0];const im=images[frame.source];
if(im&&im.complete&&im.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(im,75+shift,30,540,405)}
ellipse(720,393,12,5,'#72c5e8');ctx.fillStyle='#72c5e8';ctx.fillRect(714,355,12,36);
const active=t>=p.windup&&t<=p.activeEnd;
if(t<p.windup){ellipse(p.id==='BasaltRush'?600:530,394,75,4,'#cf503e');ellipse(340+shift,130,12+8*t/p.windup,12+8*t/p.windup,'#ffa53199')}
if(p.id==='ClawCombo'){[.35,.75].forEach((start,i)=>{const a=t-start;effect(p.id,520+a*90,315+i*18,235,120,pulse(a,.25),i===0?-.15:.15,[0,i*512,1024,512])})}
if(p.id==='TailSting'){let a=t-.65;effect(p.id,540+a*130,363,340,140,pulse(a,.3))}
if(p.id==='ClawSlam'){let a=t-.8;effect(p.id,540,335,280+a*120,230,pulse(a,.45))}
if(p.id==='TailSweep'){let a=t-.7;effect(p.id,345,369,390,130,pulse(a,.4),(a-.2)*.45)}
if(p.id==='BasaltRush'){let a=t-.75;effect(p.id,400+shift,340,370,180,pulse(a,.55))}
if(p.id==='LavaVolley'){[.8,1.05,1.3].forEach(start=>{const age=t-start;if(age>=0&&age<1){effect(p.id,420+age*350,150+age*230,125,125,Math.min(1,(1-age)*5),Math.atan2(230,350))}})}
if(p.id==='GroundEruption'){[620,720,820].forEach(x=>{if(t<1.1){ellipse(x,394,24,5,'#f2644988')}else{let a=t-1.1,s=.7+.3*Math.min(1,a/.12);effect(p.id,x,398-135*s,110,290*s,pulse(a,.48))}})}
ctx.restore();phase.textContent=`${Math.min(t,p.duration).toFixed(2)}초 · ${t<p.windup?'준비':t<=p.activeEnd?'타격':'회복'}`;seek.value=Math.min(1000,Math.round(t/p.duration*1000));c.dataset.ready=String(ready&&!failed);c.dataset.pattern=p.id;c.dataset.time=t.toFixed(3);c.dataset.effectCount=Object.keys(effectImages).length;
if(!ready||failed){ctx.fillStyle='#fff';ctx.fillText(failed?'프레임을 불러오지 못했습니다':'프레임 로딩 중',30,35)}}
// Reset on pattern selection and loop after a short readable recovery pause.
function tick(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(ready&&running){t+=dt*Number(document.getElementById('speed').value);if(t>patterns[index].duration+.6){t=0;if(document.getElementById('sequence').checked){index=(index+1)%patterns.length;update()}}}draw();requestAnimationFrame(tick)}
Promise.all(loads).then(()=>ready=true);update();requestAnimationFrame(tick);
</script></html>
